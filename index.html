<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bolta Khata AI | बोलता खाता — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container no-nav">
    
    <!-- Top Right Language Switcher -->
    <div class="top-bar-lang">
      <div class="lang-switch" role="group" aria-label="Language Selector">
        <button id="lang-btn-en" type="button" class="lang-option active" data-lang="en">English</button>
        <button id="lang-btn-hi" type="button" class="lang-option" data-lang="hi">हिंदी</button>
      </div>
    </div>

    <div class="page-content" style="padding-top: 16px;">
      
      <!-- App Header / Logo -->
      <div class="text-center mb-4">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 50%; background: var(--primary-light); color: var(--primary); margin-bottom: 12px; box-shadow: var(--shadow-sm);">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </div>
        <h1 id="i18n-app-title" style="font-size: 26px; font-weight: 800; color: var(--primary); margin-bottom: 4px;">Bolta Khata</h1>
        <p id="i18n-app-sub" style="font-size: 14px; font-weight: 600; color: var(--text-muted);">बोलता खाता AI</p>
        <p id="i18n-tagline" class="page-subtitle" style="margin-top: 4px;">Voice-first digital ledger for Kirana shops</p>
      </div>

      <!-- Main Card -->
      <div class="card" style="box-shadow: var(--shadow-md);">
        
        <!-- Toggle Tabs -->
        <div class="tab-toggle">
          <button id="tab-login" type="button" class="tab-btn active">Log In</button>
          <button id="tab-register" type="button" class="tab-btn">Register</button>
        </div>

        <!-- Login Form -->
        <form id="form-login">
          <div class="form-group">
            <label id="lbl-login-phone" class="form-label" for="login-phone">
              Mobile Number
            </label>
            <input 
              id="login-phone" 
              class="input-field" 
              type="tel" 
              inputmode="numeric" 
              pattern="[6-9][0-9]{9}" 
              placeholder="10-digit mobile number" 
              maxlength="10" 
              required
            >
          </div>

          <div class="form-group">
            <label id="lbl-login-password" class="form-label" for="login-password">
              PIN or Password
            </label>
            <input 
              id="login-password" 
              class="input-field" 
              type="password" 
              inputmode="numeric" 
              placeholder="4 or 6-digit PIN" 
              required
            >
          </div>

          <button id="btn-login-submit" type="submit" class="btn btn-primary" style="margin-top: 10px;">
            Log In
          </button>
        </form>

        <!-- Register Form -->
        <form id="form-register" class="hidden">
          <div class="form-group">
            <label id="lbl-reg-shop-name" class="form-label" for="reg-shop-name">
              Shop Name
            </label>
            <input 
              id="reg-shop-name" 
              class="input-field" 
              type="text" 
              placeholder="e.g. Gupta General Store" 
              required
            >
          </div>

          <div class="form-group">
            <label id="lbl-reg-owner-name" class="form-label" for="reg-owner-name">
              Owner Name
            </label>
            <input 
              id="reg-owner-name" 
              class="input-field" 
              type="text" 
              placeholder="e.g. Ramesh Kumar" 
              required
            >
          </div>

          <div class="form-group">
            <label id="lbl-reg-phone" class="form-label" for="reg-phone">
              Mobile Number
            </label>
            <input 
              id="reg-phone" 
              class="input-field" 
              type="tel" 
              inputmode="numeric" 
              pattern="[6-9][0-9]{9}" 
              placeholder="10-digit mobile number" 
              maxlength="10" 
              required
            >
          </div>

          <div class="form-group">
            <label id="lbl-reg-password" class="form-label" for="reg-password">
              Set PIN
            </label>
            <input 
              id="reg-password" 
              class="input-field" 
              type="password" 
              inputmode="numeric" 
              placeholder="4-digit secret PIN" 
              minlength="4" 
              required
            >
          </div>

          <button id="btn-register-submit" type="submit" class="btn btn-primary" style="margin-top: 10px;">
            Create Account
          </button>
        </form>

      </div>

      <div class="text-center" style="margin-top: 24px;">
        <p id="i18n-footer" style="font-size: 13px; color: var(--text-muted);">
          Secure & simple digital voice ledger for Indian retail
        </p>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
