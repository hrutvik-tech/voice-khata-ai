<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ग्राहक | Bolta Khata AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <header class="page-header">
      <div>
        <h1>ग्राहक सूची / Customers</h1>
        <div class="page-subtitle">खातों का विवरण / Ledger List</div>
      </div>
    </header>

    <main class="page-content">
      <div class="form-group">
        <input id="search-customer" class="input-field" type="search" placeholder="ग्राहक खोजें / Search customer...">
      </div>

      <div id="customer-list">
        <div class="card text-center" style="padding: 32px 16px; color: var(--text-muted);">
          <p>ग्राहक लोड हो रहे हैं... / Loading customers...</p>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="navbar">
      <a href="dashboard.html" class="nav-item" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>होम / Home</span>
      </a>

      <a href="customers.html" class="nav-item active" data-tab="customers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>ग्राहक / Customers</span>
      </a>

      <a href="voice.html" class="nav-mic-btn" data-tab="voice" aria-label="Voice Ledger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </a>

      <a href="history.html" class="nav-item" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>इतिहास / History</span>
      </a>
    </nav>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
      initNavbar("customers");
    });
  </script>
</body>
</html>
