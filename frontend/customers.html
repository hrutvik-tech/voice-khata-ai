<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2E7D32" />
  <title>Customers — Bolta Khata</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .search-wrapper {
      position: relative;
      margin: 0 16px 8px;
    }
    .search-wrapper .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #9e9e9e;
      pointer-events: none;
    }
    .search-wrapper .input-field {
      padding-left: 40px;
      width: 100%;
      box-sizing: border-box;
    }
    .add-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 12px;
    }
    .customer-count {
      font-size: 13px;
      color: #757575;
    }
    #similar-confirm-row {
      background: #fff8e1;
      border: 1px solid #FFB300;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 13px;
    }
    #similar-confirm-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="page-header" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px;">
      <div>
        <div style="font-size: 11px; color: #a5d6a7; font-weight: 500; letter-spacing: .5px;">BOLTA KHATA</div>
        <h1 style="margin: 0; font-size: 20px; font-weight: 800; color: #fff;" data-i18n="customersTitle">
          Customers
        </h1>
      </div>
      <button id="lang-toggle" class="btn btn-outline" style="width: auto; padding: 4px 12px; font-size: 13px; font-weight: 700; height: 32px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,0.8); color: #FFFFFF; background: rgba(255,255,255,0.15);">
        🌐 हिंदी
      </button>
    </header>

    <!-- Search bar -->
    <div class="search-wrapper" style="margin-top: 12px;">
      <span class="search-icon">🔍</span>
      <input
        id="search-input"
        type="search"
        class="input-field"
        data-i18n-placeholder="searchCustomerPlaceholder"
        placeholder="Search customer"
        autocomplete="off"
        aria-label="Search customers"
      />
    </div>

    <!-- Add Customer button + count -->
    <div class="add-row">
      <span class="customer-count" id="customer-count"></span>
      <button id="btn-add-customer" class="btn btn-primary" style="font-size: 14px; padding: 10px 16px; min-height: 44px;" data-i18n="addCustomerBtn">
        + Add Customer
      </button>
    </div>

    <!-- Customer list -->
    <div class="page-content" style="padding: 0 0 80px; overflow-y: auto;">
      <div id="customer-list">
        <div style="text-align: center; padding: 40px 20px; color: #9e9e9e;">
          <div class="spinner" style="margin: 0 auto 12px;"></div>
          <div data-i18n="loadingCustomers">Loading customers...</div>
        </div>
      </div>
    </div>

    <!-- Bottom navigation -->
    <nav class="navbar">
      <a href="dashboard.html" class="nav-item" data-tab="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label" data-i18n="navHome">Home</span>
      </a>
      <a href="customers.html" class="nav-item active" data-tab="customers">
        <span class="nav-icon">👥</span>
        <span class="nav-label" data-i18n="navCustomers">Customers</span>
      </a>
      <a href="voice.html" class="nav-item nav-mic-btn" data-tab="voice" aria-label="Voice entry">
        <span class="nav-icon">🎤</span>
      </a>
      <a href="history.html" class="nav-item" data-tab="history">
        <span class="nav-icon">📋</span>
        <span class="nav-label" data-i18n="navHistory">History</span>
      </a>
      <a href="index.html" class="nav-item" data-tab="logout" id="nav-logout">
        <span class="nav-icon">🚪</span>
        <span class="nav-label" data-i18n="navLogout">Logout</span>
      </a>
    </nav>

  </div>

  <!-- Add Customer Modal -->
  <div id="add-customer-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <h2 id="modal-title" style="margin: 0; font-size: 18px; font-weight: 800;" data-i18n="addCustomerModalTitle">
          Add Customer
        </h2>
        <button id="modal-close" aria-label="Close" style="background: none; border: none; font-size: 22px; cursor: pointer; color: #757575; padding: 4px 8px;">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="customer-name-input">
          <span data-i18n="nameLabel">Name</span> <span style="color: #c62828;">*</span>
        </label>
        <input
          id="customer-name-input"
          type="text"
          class="input-field"
          data-i18n-placeholder="namePlaceholder"
          placeholder="e.g. Ramesh Sharma"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label class="form-label" for="customer-phone-input">
          <span data-i18n="phoneOptionalLabel">Phone (optional)</span>
        </label>
        <input
          id="customer-phone-input"
          type="tel"
          class="input-field"
          placeholder="10-digit mobile number"
          pattern="[6-9][0-9]{9}"
          autocomplete="tel"
          inputmode="numeric"
          maxlength="10"
        />
      </div>

      <!-- Similar name confirmation -->
      <div id="similar-confirm-row" style="display: none;">
        <strong style="color: #E65100;">⚠️ <span data-i18n="similarFound">Similar customer found:</span></strong>
        <span id="similar-name-text"></span>
        <br/>
        <label style="margin-top: 6px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="confirm-similar" />
          <span data-i18n="addAnyway">Add anyway</span>
        </label>
      </div>

      <button id="btn-save-customer" class="btn btn-primary" style="margin-top: 20px; width: 100%; font-size: 16px;" data-i18n="saveBtn">
        Save
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/customers.js"></script>
  <script>
    // Logout handler
    document.getElementById("nav-logout").addEventListener("click", (e) => {
      e.preventDefault();
      clearAuth();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
