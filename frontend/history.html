<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2E7D32" />
  <title>History — Bolta Khata</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .date-filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .date-filter-row::-webkit-scrollbar { display: none; }
    .date-filter-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border: 1.5px solid #ccc;
      border-radius: 20px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      color: #424242;
      transition: all 0.15s;
      min-height: 36px;
    }
    .date-filter-btn.active {
      background: #2E7D32;
      border-color: #2E7D32;
      color: #fff;
    }
    .date-filter-btn:hover:not(.active) {
      border-color: #2E7D32;
      color: #2E7D32;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
    }
    .filter-row label {
      font-size: 13px;
      color: #757575;
      white-space: nowrap;
    }
    .filter-row select {
      flex: 1;
      padding: 8px 10px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: #212121;
      min-height: 40px;
    }
    #custom-date {
      flex-shrink: 0;
      padding: 8px 10px;
      border: 1.5px solid #ccc;
      border-radius: 20px;
      font-size: 13px;
      color: #424242;
      background: #fff;
      min-height: 36px;
    }
    #btn-load-more {
      display: none;
      margin: 12px auto 20px;
      padding: 12px 32px;
      background: #fff;
      border: 1.5px solid #2E7D32;
      color: #2E7D32;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      min-height: 48px;
    }
    #btn-load-more:hover {
      background: #f1f8e9;
    }
    .txn-amount {
      text-align: right;
      min-width: 80px;
      line-height: 1.3;
    }
    .txn-amount.credit { color: #2E7D32; }
    .txn-amount.debit  { color: #c62828; }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="page-header" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px;">
      <div>
        <div style="font-size: 11px; color: #a5d6a7; font-weight: 500; letter-spacing: .5px;">BOLTA KHATA</div>
        <h1 style="margin: 0; font-size: 20px; font-weight: 800; color: #fff;" data-i18n="transactionsTitle">
          Transactions
        </h1>
      </div>
      <button id="lang-toggle" class="btn btn-outline" style="width: auto; padding: 4px 12px; font-size: 13px; font-weight: 700; height: 32px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,0.8); color: #FFFFFF; background: rgba(255,255,255,0.15);">
        🌐 हिंदी
      </button>
    </header>

    <!-- Date quick-filter chips -->
    <div class="date-filter-row" role="group" aria-label="Date range filter">
      <button class="date-filter-btn active" data-range="today" data-i18n="filterToday">Today</button>
      <button class="date-filter-btn" data-range="yesterday" data-i18n="filterYesterday">Yesterday</button>
      <button class="date-filter-btn" data-range="week" data-i18n="filterThisWeek">This Week</button>
      <button class="date-filter-btn" data-range="month" data-i18n="filterThisMonth">This Month</button>
      <input type="date" id="custom-date" aria-label="Custom date" title="Pick a date" />
    </div>

    <!-- Customer filter -->
    <div class="filter-row">
      <label for="customer-filter">👤</label>
      <select id="customer-filter" aria-label="Filter by customer">
        <option value="" id="opt-all-customers" data-i18n="allCustomersOption">All customers</option>
      </select>
    </div>

    <!-- Transaction list -->
    <div class="page-content" style="padding: 0 0 80px; overflow-y: auto;">
      <div id="history-list">
        <div style="text-align: center; padding: 40px 20px; color: #9e9e9e;">
          <div class="spinner" style="margin: 0 auto 12px;"></div>
          <div data-i18n="loadingTransactions">Loading transactions...</div>
        </div>
      </div>

      <!-- Load More -->
      <div style="text-align: center;">
        <button id="btn-load-more" data-i18n="btnLoadMore">Load More</button>
      </div>
    </div>

    <!-- Bottom navigation -->
    <nav class="navbar">
      <a href="dashboard.html" class="nav-item" data-tab="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label" data-i18n="navHome">Home</span>
      </a>
      <a href="customers.html" class="nav-item" data-tab="customers">
        <span class="nav-icon">👥</span>
        <span class="nav-label" data-i18n="navCustomers">Customers</span>
      </a>
      <a href="voice.html" class="nav-item nav-mic-btn" data-tab="voice" aria-label="Voice entry">
        <span class="nav-icon">🎤</span>
      </a>
      <a href="history.html" class="nav-item active" data-tab="history">
        <span class="nav-icon">📋</span>
        <span class="nav-label" data-i18n="navHistory">History</span>
      </a>
      <a href="index.html" class="nav-item" data-tab="logout" id="nav-logout">
        <span class="nav-icon">🚪</span>
        <span class="nav-label" data-i18n="navLogout">Logout</span>
      </a>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/history.js"></script>
  <script>
    document.getElementById("nav-logout").addEventListener("click", (e) => {
      e.preventDefault();
      clearAuth();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
